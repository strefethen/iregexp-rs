name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow reruns every gate on the tagged commit.
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify; empty uses the triggering ref
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format (Linux only)
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-features --locked

  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify imported file provenance
        run: python3 scripts/check-provenance.py

      - name: Verify publish settings
        run: bash scripts/ci/verify-private-package.sh

      - name: Verify CHANGELOG version matches Cargo.toml
        run: bash scripts/ci/verify-changelog-version.sh

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Resource limits and stack behavior can differ with optimizations.
      - name: Release-mode tests
        run: cargo test --release --all-features --locked

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

      - name: Packaged build
        run: cargo package --locked

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-features --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      # Pinned so a newer cargo-audit can't require a Rust newer than the job's.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit
        run: cargo audit
